<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SferaDating</title>
<style>
:root{--bg:#120b22;--cd:#1d1436;--tx:#f5efff;--mu:#a99bc9;--a:#a855f7;--b:#ec4899;--ln:#31255a}
[data-theme=light]{--bg:#faf6ff;--cd:#fff;--tx:#241638;--mu:#6b5b8a;--ln:#e6dcf5}
@media(prefers-color-scheme:light){[data-theme=auto]{--bg:#faf6ff;--cd:#fff;--tx:#241638;--mu:#6b5b8a;--ln:#e6dcf5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
#app{max-width:680px;margin:auto;padding:16px}.mu{color:var(--mu)}h1{font-size:2rem;margin:.4em 0}
.logo{font-size:1.5rem;font-weight:800;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;margin:8px 0;font:600 1rem inherit;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));cursor:pointer;transition:transform .15s}.btn:active{transform:scale(.97)}
.btn.ghost{background:none;border:1px solid var(--a);color:var(--tx)}.btn.sm{display:inline-block;width:auto;padding:8px 12px;margin:3px;font-size:.9rem}
input,select,textarea{width:100%;padding:12px;margin:5px 0;border-radius:12px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font:inherit}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;overflow:hidden;margin:14px 0}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.card .in{padding:14px}
.tag{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--ln);margin:2px 3px 2px 0}.tag.r{background:#7f1d3d;color:#fff}
.blue{color:#3b9cff}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--cd);border-top:1px solid var(--ln);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-size:.8rem;cursor:pointer;padding:4px 14px}nav button.on{color:var(--b);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:90px}.bub{max-width:80%;padding:8px 12px;border-radius:16px;margin:4px 0;background:var(--cd);border:1px solid var(--ln);width:fit-content}.bub.me{margin-left:auto;background:var(--a);color:#fff;border:0}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--b);color:#fff;padding:10px 16px;border-radius:12px;z-index:9;animation:in .25s}@keyframes in{from{opacity:0;top:0}}
#co{display:none;position:fixed;inset:0;background:#000d;z-index:8;flex-direction:column;align-items:center;justify-content:center}#co video{max-width:92%;max-height:70%;border-radius:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><nav id="nv" hidden></nav>
<div id="co"><video id="rv" autoplay playsinline></video><button class="btn sm" onclick="hang(1)">Завершить звонок</button></div>
<script>
const SERVER=''; // ← адрес вашего сервера, например 'https://api.vash-sait.com' (пусто = тот же домен)
let T=localStorage.t,me,tab='feed',cur=null,ws,pc,ls,pend=[];
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,m='GET',b)=>{const r=await fetch(SERVER+'/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw j.e||'Ошибка';return j};
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3200)};
const theme=t=>{localStorage.th=t;document.documentElement.dataset.theme=t};theme(localStorage.th||'dark');
const G={friends:'Дружба',interests:'Общие интересы',games:'Совместные игры',chat:'Общение',romance:'Романтика (18+)'},V=h=>$('#app').innerHTML=h;
const tr=f=>async(...a)=>{try{await f(...a)}catch(e){toast(String(e))}};
function welcome(){$('#nv').hidden=true;V(`<div class="logo">◉ SferaDating</div><h1>Добро пожаловать</h1><p class=mu>Только для пользователей 18+</p><p class=mu>🔒 Номер телефона, email и точное местоположение скрыты от других пользователей.</p><p class=mu>🛡 Мы проверяем анкеты на мошенников. Любую анкету можно заблокировать или отправить на проверку.</p><button class=btn onclick="auth('reg')">Регистрация</button><button class="btn ghost" onclick="auth('in')">Войти</button>`)}
function auth(m){const r=m==='reg';V(`<div class="logo">◉ SferaDating</div><h1>${r?'Регистрация':'Вход'}</h1><input id=e type=email placeholder="Email"><input id=p type=password placeholder="Пароль (от 8 символов)">${r?'<input id=p2 type=password placeholder="Повторите пароль"><input id=ag type=number min=18 placeholder="Возраст (только 18+)">':''}<button class=btn id=go>${r?'Создать аккаунт':'Войти'}</button>${r?'':'<button class="btn ghost" id=fg>Забыли пароль?</button>'}<button class="btn ghost" onclick="welcome()">Назад</button>`);
 $('#go').onclick=tr(async()=>{const e=$('#e').value,p=$('#p').value;if(r){if(p!==$('#p2').value)throw'Пароли не совпадают';await api('/register','POST',{email:e,password:p,age:+$('#ag').value});toast('Проверьте почту: подтвердите email')}
  const j=await api('/login','POST',{email:e,password:p});T=localStorage.t=j.token;boot()});
 if(!r)$('#fg').onclick=tr(async()=>{const e=prompt('Ваш email');if(e){await api('/forgot','POST',{email:e});toast('Если email есть в системе, ссылка отправлена')}})}
async function boot(){const rs=new URLSearchParams(location.search).get('reset');if(rs){const p=prompt('Новый пароль (от 8 символов)');if(p)try{await api('/reset','POST',{t:rs,password:p});toast('Пароль изменён')}catch(e){toast(e)}history.replaceState(0,'','/')}
 if(!T)return welcome();try{me=await api('/me')}catch{T=localStorage.t='';return welcome()}
 ws&&ws.close();ws=new WebSocket((SERVER||location.origin).replace(/^http/,'ws')+'/ws?t='+T);ws.onmessage=e=>onWs(JSON.parse(e.data));
 me.hasProfile?go('feed'):form()}
function form(){const p=me.profile||{},r=me.age>=18;V(`<h1>Ваша анкета</h1><input type=file id=ph accept="image/*"><input id=n placeholder="Имя" value="${E(p.name)}"><input id=c placeholder="Город" value="${E(p.city)}"><textarea id=b rows=3 placeholder="О себе">${E(p.bio)}</textarea><input id=h placeholder="Хобби и интересы (через запятую)" value="${E(p.hobbies)}"><select id=g>${Object.entries(G).filter(([k])=>r||k!=='romance').map(([k,v])=>`<option value=${k} ${p.goal===k?'selected':''}>${v}</option>`).join('')}</select><select id=s><option value="">Пол: не указывать</option><option ${p.gender=='m'?'selected':''} value=m>Мужской</option><option ${p.gender=='f'?'selected':''} value=f>Женский</option></select><input id=t placeholder="Телефон (необязательно, всегда скрыт)" value="${E(p.phone)}"><button class=btn id=sv>Опубликовать</button>`);let img=p.photo;
 $('#ph').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,600/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.8)};i.src=URL.createObjectURL(f)};
 $('#sv').onclick=tr(async()=>{await api('/profile','POST',{photo:img,name:$('#n').value,city:$('#c').value,bio:$('#b').value,hobbies:$('#h').value,goal:$('#g').value,gender:$('#s').value,phone:$('#t').value});toast('Анкета опубликована');me=await api('/me');go('feed')})}
function go(t){tab=t;cur=null;const N=[['feed','Анкеты'],['fav','Избранное'],['chats','Чаты'],['set','Настройки']];if(['owner','admin','mod'].includes(me.role))N.push(['adm','Панель']);
 const n=$('#nv');n.hidden=false;n.innerHTML=N.map(([k,v])=>`<button class="${k===t?'on':''}" onclick="go('${k}')">${v}</button>`).join('');({feed:()=>feed(),fav:()=>feed(1),chats,set:sets,adm})[t]()}
const F={};
async function feed(fav){const q=new URLSearchParams({...F,fav:fav?1:''});const L=await api('/feed?'+q);
 V(`<div class=logo>◉ SferaDating</div>${fav?'<h2>Избранное</h2>':`<details><summary class=mu>Фильтры</summary><div class=row><input id=fa type=number placeholder="Возраст от" value="${F.min||''}"><input id=fb type=number placeholder="до" value="${F.max||''}"></div><input id=fc placeholder="Город" value="${F.city||''}"><input id=fq placeholder="Хобби / интересы" value="${F.q||''}"><select id=fg><option value="">Любая цель</option>${Object.entries(G).map(([k,v])=>`<option value=${k} ${F.goal===k?'selected':''}>${v}</option>`).join('')}</select><label><input type=checkbox id=fv style="width:auto" ${F.blue?'checked':''}> Только верифицированные</label><button class="btn sm" id=fs>Применить</button></details>`}${L.map(cardH).join('')||'<p class=mu>Пока никого нет. Измените фильтры или загляните позже.</p>'}`);
 if(!fav)$('#fs').onclick=()=>{F.min=$('#fa').value;F.max=$('#fb').value;F.city=$('#fc').value;F.q=$('#fq').value;F.goal=$('#fg').value;F.blue=$('#fv').checked?'1':'';localStorage.f=JSON.stringify(F);feed()}}
Object.assign(F,JSON.parse(localStorage.f||'{}')); // фильтры сохраняются
const cardH=c=>`<div class=card><img src="${E(c.photo)}" alt=""><div class=in><b>${E(c.name)}, ${c.age}</b> ${c.blue?'<span class=blue title="Верифицирован">✔</span>':''} <span class=mu>• ${E(c.city)}</span><div>${c.labels.map(l=>`<span class="tag r">${E(l)}</span>`).join('')}<span class=tag>${G[c.goal]||''}</span></div><p>${E(c.bio)}</p><div class=mu>${E(c.hobbies)}</div><div class=mu style="font-size:.8rem">${new Date(c.pub).toLocaleDateString()} · ♥ ${c.likes} · 👁 ${c.views} · ☆ ${c.favs}</div><div class=row><button class="btn sm" onclick="rx(${c.id},'like')">♥ Лайк</button><button class="btn sm" onclick="rx(${c.id},'heart')">💌</button><button class="btn sm" onclick="rx(${c.id},'fav')">☆</button><button class="btn sm" onclick="chat(${c.id},'${E(c.name)}')">Написать</button></div><button class="btn sm ghost" onclick="rep(${c.id})">Пожаловаться</button><button class="btn sm ghost" onclick="blk(${c.id})">Заблокировать</button></div></div>`;
const rx=tr(async(i,k)=>{const r=await api(`/react/${i}/${k}`,'POST');toast(r.on?'Готово':'Убрано')});
const rep=tr(async i=>{const R=['Спам','Мошенничество','Скам','Оскорбления','Подозрительный аккаунт','Фальшивое фото','Неприемлемое поведение','Другое'],n=prompt('Причина (номер):\n'+R.map((x,j)=>j+1+'. '+x).join('\n'));if(!n||!R[n-1])return;await api('/report/'+i,'POST',{reason:R[n-1],txt:prompt('Описание (необязательно)')||''});toast('Жалоба отправлена')});
const blk=tr(async i=>{if(confirm('Заблокировать пользователя?')){await api('/block/'+i,'POST');toast('Заблокирован');go(tab)}});
const chats=tr(async()=>{const L=await api('/chats');V(`<h2>Сообщения</h2>${L.map(c=>`<div class=card onclick="chat(${c.id},'${E(c.name)}')"><div class=in><b>${E(c.name)}</b> ${c.unread?`<span class=tag>${c.unread}</span>`:''}<div class=mu>${E(c.last)}</div></div></div>`).join('')||'<p class=mu>Чатов пока нет. Откройте анкету и нажмите «Написать» — взаимные лайки не нужны.</p>'}`)});
const chat=tr(async(id,name)=>{cur=id;const L=await api('/msgs/'+id);tab='chat';V(`<div class=row style="align-items:center"><button class="btn sm ghost" onclick="go('chats')">←</button><b>${E(name)}</b>${me.calls?`<button class="btn sm" onclick="call(${id},0)">📞</button><button class="btn sm" onclick="call(${id},1)">🎥</button>`:''}</div><div id=ms>${L.map(m=>`<div class="bub ${m.a===me.id?'me':''}">${E(m.body)}<div style="font-size:.7rem;opacity:.7">${new Date(m.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${m.a===me.id?(m.rd?' ✓✓':' ✓'):` · <a href="#" style="color:inherit" onclick="rep(${id});return false">⚠</a>`}${m.a===me.id?` <a href="#" style="color:inherit" onclick="dm(${m.id},${id},'${E(name)}');return false">🗑</a>`:''}</div></div>`).join('')}</div><div class=row style="position:sticky;bottom:80px"><input id=mi placeholder="Сообщение" style="flex:5"><button class="btn sm" id=sd>➤</button></div>`);scrollTo(0,1e9);
 const send=tr(async()=>{const v=$('#mi').value.trim();if(!v)return;await api('/msg/'+id,'POST',{body:v});chat(id,name)});$('#sd').onclick=send;$('#mi').onkeydown=e=>e.key==='Enter'&&send()});
const dm=tr(async(m,id,n)=>{await api('/msg/'+m,'DELETE');chat(id,n)});
function onWs(d){if(d.type==='note')toast(d.text);if(d.type==='msg'){toast('Новое сообщение');if(cur===d.from)chat(cur,'');else if(tab==='chats')chats()}if(d.type==='call')sig(d)}
// Звонки (WebRTC): сервер пропускает только если чат начат и у обоих включена функция в настройках
async function prep(id,v){ls=await navigator.mediaDevices.getUserMedia({audio:1,video:!!v});pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});ls.getTracks().forEach(t=>pc.addTrack(t,ls));pc.ontrack=e=>$('#rv').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:'call',to:id,data:{ice:e.candidate}}));$('#co').style.display='flex'}
const call=tr(async(id,v)=>{cur=id;await prep(id,v);const o=await pc.createOffer();await pc.setLocalDescription(o);ws.send(JSON.stringify({type:'call',to:id,data:{offer:o,video:v}}))});
const sig=async({from,data:d})=>{try{if(d.offer){if(!confirm('Входящий звонок. Ответить?')){ws.send(JSON.stringify({type:'call',to:from,data:{end:1}}));return}cur=from;await prep(from,d.video);await pc.setRemoteDescription(d.offer);for(const c of pend)await pc.addIceCandidate(c);pend=[];const a=await pc.createAnswer();await pc.setLocalDescription(a);ws.send(JSON.stringify({type:'call',to:from,data:{answer:a}}))}
 else if(d.answer)await pc.setRemoteDescription(d.answer);else if(d.ice)pc&&pc.remoteDescription?await pc.addIceCandidate(d.ice):pend.push(d.ice);else if(d.end)hang()}catch(e){toast('Ошибка звонка')}};
function hang(s){s&&cur&&ws.send(JSON.stringify({type:'call',to:cur,data:{end:1}}));pc&&pc.close();ls&&ls.getTracks().forEach(t=>t.stop());pc=ls=null;$('#co').style.display='none'}
function sets(){V(`<h2>Настройки</h2><h3>Оформление</h3><select onchange="theme(this.value)"><option value=dark ${localStorage.th=='dark'?'selected':''}>Тёмная</option><option value=light ${localStorage.th=='light'?'selected':''}>Светлая</option><option value=auto ${localStorage.th=='auto'?'selected':''}>Авто</option></select><h3>Приватность</h3><label><input type=checkbox id=cl style="width:auto" ${me.calls?'checked':''}> Разрешить звонки (только в уже начатых чатах)</label><br><label><input type=checkbox id=hd style="width:auto" ${me.profile&&me.profile.hidden?'checked':''}> Скрыть мою анкету</label><button class=btn id=ss>Сохранить</button><button class="btn ghost" onclick="form()">Редактировать анкету</button><h3>Аккаунт</h3><p class=mu>${E(me.email)}${me.ver?'':' — email не подтверждён'}</p><button class="btn ghost" onclick="T=localStorage.t='';location.reload()">Выйти</button><button class="btn ghost" id=dl>Удалить аккаунт</button><p class=mu style="text-align:center">Создатель: Sfera_00000</p>`);
 $('#ss').onclick=tr(async()=>{await api('/settings','POST',{calls:$('#cl').checked,hidden:$('#hd').checked});me=await api('/me');toast('Сохранено')});$('#dl').onclick=tr(async()=>{if(confirm('Удалить аккаунт навсегда?')){await api('/me','DELETE');T=localStorage.t='';location.reload()}})}
const adm=tr(async()=>{const[s,R,Lg]=await Promise.all([api('/admin/stats'),api('/admin/reports'),api('/admin/log')]),o=me.role==='owner',A=o?['ban','unban','mute','unmute','warn','label','unlabel','blue','unblue','admin','unadmin','mod','unmod','delprof']:me.role==='admin'?['ban','unban','mute','unmute','warn','label','unlabel']:['mute','warn'];
 V(`<div class=logo>${o?'ПАНЕЛЬ СОЗДАТЕЛЯ SFERA':'Панель модерации'}</div><div class=row>${[['Всего',s.users],['Онлайн',s.online],['Новые 24ч',s.fresh],['Баны',s.banned],['Жалобы',s.reports],['Анкеты',s.profiles],['Сообщений',s.msgs]].map(([k,v])=>`<div class=card style="margin:4px"><div class=in><b>${v}</b><div class=mu>${k}</div></div></div>`).join('')}</div><h3>Действие</h3><input id=ai placeholder="ID или email"><select id=aa>${A.map(a=>`<option>${a}</option>`).join('')}</select><select id=al>${['Спам','Скам','Мошенник','Бот','Рекомендован','Подозрительный'].map(a=>`<option>${a}</option>`).join('')}</select><button class=btn id=ab>Выполнить</button><h3>Жалобы</h3>${R.map(r=>`<div class=card><div class=in>На #${r.tg} от #${r.f} · <b>${E(r.reason)}</b> · уникальных: ${r.uniq}<div class=mu>${E(r.txt)} ${new Date(r.t).toLocaleString()}</div></div></div>`).join('')||'<p class=mu>Жалоб нет</p>'}<h3>Журнал</h3>${Lg.map(l=>`<div class=mu>${new Date(l.t).toLocaleString()} · ${l.actor?'#'+l.actor:'авто'} · ${E(l.act)} → #${l.tg}</div>`).join('')}`);
 $('#ab').onclick=tr(async()=>{await api('/admin/act','POST',{id:$('#ai').value,act:$('#aa').value,l:$('#al').value});toast('Выполнено');adm()})});
boot();
</script></body></html>
